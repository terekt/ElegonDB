<script>
/* Resolve the theme before first paint: a stored choice if there is one, otherwise
   whatever the operating system asks for. Kept inline and tiny on purpose — loading it
   from app.js would paint the wrong theme first and then correct it. */
(function () {
  var saved = null;
  try { saved = localStorage.getItem("elegon-theme"); } catch (e) { /* private mode */ }
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
})();

<script>
/* The interactive map.
   Markers live inside a stage sized to the capture in image pixels, so a marker's position
   is just the projection's output. The stage is then translated and scaled as one, which
   keeps pan and zoom to a single transform however many markers are on it. Markers carry a
   counter-scale from a CSS variable so they stay the same size on screen as you zoom. */

/* Gathering is two jobs wearing one label. A vein is a skill you level and a route you plan;
   a wood pile is a quest step you do once and never look at again. Splitting them off the
   node's own gathering_skill_id rather than a hand-kept list, so a second skill lands here
   on its own — which is also why the mining row is named after the skill instead of "Mining"
   being hardcoded. */
const MINE_KINDS = [...new Set((D.objects ? Object.values(D.objects) : [])
  .map(o => o.skill).filter(Boolean))];
const SKILL_BY_ID = new Map((D.skills || []).map(s => [s.id, s]));
const gatherKind = o => (o && o.skill) ? "mine" : "quest";

const KINDS = [
  {key: "mob", label: "Monsters"},
  {key: "npc", label: "NPCs"},
  {key: "mine", label: MINE_KINDS.length === 1 && SKILL_BY_ID.get(MINE_KINDS[0])
                       ? SKILL_BY_ID.get(MINE_KINDS[0]).name : "Mining"},
  {key: "quest", label: "Quest objects"},
  {key: "portal", label: "Rift entrances"},
  {key: "respawn", label: "Respawn points"},
];

/* The kinds whose panel row carries a glyph rather than the marker's own disc. */
const GLYPH_KINDS = new Set(["mob", "npc", "mine", "quest"]);

const S = {map: null, q: "", lo: null, hi: null, merchants: false, coverage: false,
           on: {mob: true, npc: true, mine: true, quest: true, portal: true, respawn: true}};

let drawCoverage = () => {};
let liveSpawns = null;
let liveMarker = null;
let startLive = () => {};
let stopLive = () => {};
let setCoverLabel = () => {};

const view = document.getElementById("view");
const stage = document.getElementById("stage");
const markers = document.getElementById("markers");
const kinLayer = document.getElementById("markersKin");
const liveLayer = document.getElementById("live");
const empty = document.getElementById("empty");

/* ---- what each marker is ------------------------------------------------- */

document.getElementById("youWrap").appendChild(levelPicker({slider: true}));

const SOURCE_BY_ENEMY = new Map(DROP.sources.filter(s => !s.node).map(s => [s.id, s]));
const MONSTER_BY_ID = new Map(D.monsters.map(m => [m.id, m]));
const OBJECTS = D.objects || {};

/* Colour says what family it belongs to. The number on the marker says what level it is.

   Colour used to try to carry both, shading the family hue by level, and it could not: Snow
   Wolf and Frostfang Wolf are five levels apart in the same snowfield, and no two shades of
   one blue tell them apart at 25px. Nor can the portrait — those two share a model, so their
   markers are identical whatever sits behind. A written level is exact, needs no legend, and
   answers to the level rather than to the band. */
const FALLBACK_COLOURS = {tint: "oklch(0.72 0.02 250)", disc: "oklch(0.64 0.02 250)",
                          badge: "oklch(0.30 0.02 250)"};
const creatureColour = (id, key) =>
  (MONSTER_BY_ID.get(id) || {})[key] || FALLBACK_COLOURS[key];

/* People and props are not level-scaled, so their disc is simply a light backdrop in their
   own colour — the same treatment, so every marker on the map reads the same way. */
const NPC_DISC = "oklch(0.76 0.03 250)", MERCHANT_DISC = "oklch(0.80 0.07 85)";
const OBJ_DISC = "oklch(0.79 0.05 150)";
/* A vein's ring is the game's OWN tint_hex — the colour the ore is painted in the world, so
   the marker and the thing you are walking towards match. The four are far enough apart
   (copper, ice, violet, ember) that they need no help from us. The disc stays neutral so a
   pale ring like Frostsilver's still reads against it. */
const MINE_DISC = "oklch(0.30 0.02 60)", MINE_RING = "#c98f3b";

/* People are not colour-coded. Their portraits already differ, and thirty hues among the
   creatures' thirty-seven was noise standing in for information. The one distinction worth
   drawing is who will trade with you, so a merchant is gold and everyone else is slate. */
const NPC_PLAIN = "#7d8aa0", NPC_MERCHANT = "#d9a53c";
const npcColour = shop => (shop ? NPC_MERCHANT : NPC_PLAIN);

/** Name, level and what clicking it should open, for one spawn point. */
function describe(code, id) {
  if (code === 0) {
    const m = MONSTER_BY_ID.get(id);
    const src = SOURCE_BY_ENEMY.get(id);
    return {kind: "mob", name: m ? m.name : "Enemy " + id, lvl: m ? m.lvl : 0,
            boss: !!(m && m.boss),
            note: m && m.aggressive ? "aggressive" : "", colour: creatureColour(id, "tint"),
            disc: creatureColour(id, "disc"), badge: creatureColour(id, "badge"),
            art: {kind: "monsters", id, has: !!(m && m.icon)}, monster: m,
            drops: src ? dropsOf(src).length : 0,
            open: src ? () => openSheet(monsterSheet(src)) : null};
  }
  if (code === 2) {
    const n = NPC_BY_ID.get(id);
    const shop = SHOP_BY_NPC.get(id);
    // No level: every NPC is level 1 and none of them fight, so the number said nothing.
    return {kind: "npc", name: n ? n.name : "NPC " + id, lvl: 0, colour: npcColour(shop),
            disc: shop ? MERCHANT_DISC : NPC_DISC,
            quests: (QUESTS_BY_GIVER.get(id) || []).length,
            note: n && n.role ? n.role : "", npc: n, shop,
            art: {kind: "npcs", id, has: !!(n && n.icon)},
            open: () => openSheet(npcSheet(id))};
  }
  const obj = OBJECTS[id] || {};
  const name = obj.name || "Object " + id;
  const mining = !!obj.skill;
  // The skill it needs is the one thing worth knowing before walking to a vein, so it is on
  // the marker rather than a click away.
  const skill = mining ? SKILL_BY_ID.get(obj.skill) : null;
  const note = mining
    ? (obj.req ? `${skill ? skill.name : "Mining"} ${obj.req}` : (skill ? skill.name : "Mining"))
    : "quest object";
  return {kind: gatherKind(obj), name, lvl: 0, note,
          disc: mining ? MINE_DISC : OBJ_DISC,
          colour: mining ? (obj.tint || MINE_RING) : undefined,
          art: {kind: "objects", id, has: !!obj.icon},
          // Every place it stands, not the one-row loot table — the same sheet the quest
          // page opens, so a node is one thing however you reach it.
          open: () => openSheet(gatherSheet(id))};
}

/* ---- map selector -------------------------------------------------------- */

/** Switches to a map by id, which is also how a portal marker travels. */
function showMap(mapId) {
  const m = D.maps.find(x => x.id === mapId);
  if (!m || m === S.map) return;
  S.map = m;
  // The readout names a position on the map being left behind, so it goes with it.
  document.getElementById("coords").hidden = true;
  build();
  fit();
}

const mapsel = document.getElementById("mapsel");
for (const m of D.maps) {
  const chip = el("span", "chip", m.name + (m.img ? "" : " ·"));
  if (!m.img) chip.title = m.name + " has no terrain to draw — shown as a grid";
  // A drawn plan and a photograph of the ground are different kinds of claim, so the one
  // that was derived says so rather than passing itself off as a picture of the place.
  else if (m.plan)
    chip.title = m.name + " is drawn from the rift's collision mesh, not photographed: the "
               + "game's own capture of a breach looks straight down onto the rock that "
               + "closes over it. Lighter ground is higher.";
  chip.onclick = () => showMap(m.id);
  chip.dataset.map = m.id;
  mapsel.appendChild(chip);
}

const kinds = document.getElementById("kinds");
const kindRows = {};
for (const k of KINDS) {
  const row = el("button", "panelrow on");
  row.type = "button";
  // Five of the six kinds carry real art, and a category row is a better place for it than
  // a coloured dot: a skull says "creature" without having to be learned. The portal and
  // the gravestone are already drawn in style.css and are only sized up here; the quest
  // row takes the art of whichever object it has most of, set in syncPanel.
  const dot = el("i", "mk mk-" + k.key + (GLYPH_KINDS.has(k.key) ? " glyph" : ""));
  // No art for a person in the export, so that mark is geometry: a stem and a dot.
  if (k.key === "npc") dot.append(el("i", "stem"), el("i", "dot"));
  row.append(dot, el("span", "panelname", k.label), el("span", "paneln", ""));
  row.onclick = () => {
    S.on[k.key] = !S.on[k.key];
    row.classList.toggle("on", S.on[k.key]);
    draw();
  };
  kindRows[k.key] = row;
  kinds.appendChild(row);

  // Narrowing NPCs to the ones who sell something belongs under NPCs rather than beside it:
  // it is not a fifth kind of marker, it is less of the fourth. Hidden on maps with no
  // merchants at all, which is every breach.
  if (k.key === "npc") {
    const sub = el("button", "panelsub");
    sub.type = "button";
    sub.append(el("span", "panelname", "Merchants only"), el("span", "paneln", ""));
    sub.onclick = () => {
      S.merchants = !S.merchants;
      sub.classList.toggle("on", S.merchants);
      draw();
    };
    kindRows.merchants = sub;
    kinds.appendChild(sub);
  }
}

document.getElementById("q").oninput = e => { S.q = e.target.value.toLowerCase(); draw(); };
document.getElementById("lo").oninput = e => { S.lo = e.target.value === "" ? null : +e.target.value; draw(); };
document.getElementById("hi").oninput = e => { S.hi = e.target.value === "" ? null : +e.target.value; draw(); };
document.getElementById("reset").onclick = () => fit();

/** Zooms about the centre of the frame, which is what a button press should do. */
function zoomBy(factor) {
  const r = viewSize();
  const cx = r.width / 2, cy = r.height / 2;
  const next = clamp(V.scale * factor, fitScale(), MAX_SCALE);
  const f = next / V.scale;
  V.x = cx - (cx - V.x) * f;
  V.y = cy - (cy - V.y) * f;
  V.scale = next;
  clampPan();
  // Coalesced to one repaint a frame. A zoom step has to rewrite every marker's transform,
  // which is 1,555 style recalculations and the one thing on this page that still costs
  // real time; a trackpad emits wheel events far faster than a frame, and doing that work
  // per event rather than per frame was several of them stacked up behind one gesture.
  requestZoomApply();
}
document.getElementById("zin").onclick = () => zoomBy(1.6);
document.getElementById("zout").onclick = () => zoomBy(1 / 1.6);

/* The legend used to show one orange dot for "Monsters" while every creature had its own
   colour, which said nothing true. It is now a key to what is actually on this map: the
   fixed kinds, then each species present with its colour, level and count. Selecting a
   species isolates it; hovering one lights its spawns, the same as hovering a marker. */

const speciesBox = document.getElementById("species");
const speciesRows = {};

/* The creatures on this map, in the same panel as the switches that hide them. Each row is
   the key to a colour and the control for it at once: hovering lights that species' spawns,
   selecting isolates it through the search box so the two can never disagree. */
function buildLegend() {
  speciesBox.replaceChildren();
  for (const k of Object.keys(speciesRows)) delete speciesRows[k];

  for (const k of KINDS)
    kindRows[k.key].hidden = !points.some(p => p.kind === k.key);

  // A merchant toggle on a map with no merchants would be a control that does nothing, and
  // one left switched on from another map would silently hide every NPC here.
  const merchants = points.filter(p => p.kind === "npc" && p.shop).length;
  kindRows.merchants.hidden = !merchants;
  kindRows.merchants.querySelector(".paneln").textContent = merchants || "";
  if (!merchants && S.merchants) {
    S.merchants = false;
    kindRows.merchants.classList.remove("on");
  }

  const species = new Map();
  for (const p of points) {
    if (p.kind !== "mob" || worthless(p)) continue;
    const found = species.get(p.key);
    if (found) found.n++;
    else species.set(p.key, {n: 1, name: p.name, lvl: p.lvl, colour: p.colour,
                             disc: p.disc, art: p.art, key: p.key, monster: p.monster,
                             boss: p.boss});
  }

  const head = document.getElementById("speciesHead");
  head.hidden = !species.size;
  speciesBox.hidden = !species.size;
  if (!species.size) return;
  head.textContent = `${species.size} creatures here`;

  for (const sp of [...species.values()].sort((a, b) => a.lvl - b.lvl || a.name.localeCompare(b.name))) {
    const row = el("button", "panelrow sp on");
    row.type = "button";
    // The same face the markers wear, so the list and the map name the creature the same way.
    const dot = el("i", "mk mk-mob" + (sp.boss ? " boss" : ""));
    dot.style.setProperty("--c", sp.colour);
    if (sp.disc) dot.style.setProperty("--d", sp.disc);
    if (sp.art && sp.art.has) {
      dot.classList.add("mkart");
      dot.style.setProperty("--art", `url("icons/${sp.art.kind}/${sp.art.id}.png")`);
    }
    const label = el("span", "panelname" + (sp.boss ? " bossname" : ""), sp.name);
    row.append(dot, label,
               el("span", "panellvl", "L" + sp.lvl), el("span", "paneln", String(sp.n)));
    if (sp.monster && LEVEL.value !== null) {
      const reward = xpAt(sp.monster);
      /* Abbreviated, because the floor a creature far above you pays is a twentieth of your
         own level's requirement — eleven digits by level 79 — and beside it what that is
         actually worth, spent down the curve rather than against this level alone. */
      const xp = el("span", "panelxp" + (reward ? "" : " nil"));
      if (reward) {
        xp.append(el("b", null, abbrevNum(reward)),
                  el("i", null, levelShare(reward, LEVEL.value)));
        xp.title = `${fmtNum(reward)} XP each at level ${LEVEL.value}`
                 + ` — ${levelShare(reward, LEVEL.value)} of a level`;
      } else {
        xp.textContent = "none";
        xp.title = `Nothing at level ${LEVEL.value} — you are too far above it`;
      }
      row.appendChild(xp);
    }
    row.onmouseenter = () => highlight(sp.key);
    row.onmouseleave = () => highlight(null);
    row.onclick = () => {
      const box = document.getElementById("q");
      box.value = S.q === sp.name.toLowerCase() ? "" : sp.name;
      box.dispatchEvent(new Event("input"));
    };
    speciesRows[sp.key] = row;
    speciesBox.appendChild(row);
  }
}

/** Keeps the panel honest about what the map is currently showing. */
function syncPanel() {
  const shownBy = new Map();
  for (const p of shownPoints) shownBy.set(p.key, (shownBy.get(p.key) || 0) + 1);

  const questArt = new Map();
  for (const p of points)
    if (p.kind === "quest" && p.art && p.art.has)
      questArt.set(p.art.id, (questArt.get(p.art.id) || 0) + 1);
  const commonest = [...questArt.entries()].sort((a, b) => b[1] - a[1])[0];
  const questDot = kindRows.quest && kindRows.quest.querySelector(".mk");
  if (questDot)
    questDot.style.backgroundImage =
      commonest ? `url("icons/objects/${commonest[0]}.png")` : "";

  for (const k of KINDS) {
    const total = points.filter(p => p.kind === k.key).length;
    const now = shownPoints.filter(p => p.kind === k.key).length;
    kindRows[k.key].querySelector(".paneln").textContent =
      S.on[k.key] && now !== total ? `${now}/${total}` : String(total);
  }
  // A species hidden by the level filter or the search is dimmed rather than removed, so
  // the list stays a stable picture of the map.
  for (const [key, row] of Object.entries(speciesRows))
    row.classList.toggle("off", !shownBy.has(key));
}
/* Filled in by the staging block below; a no-op in a release, where the overworld has only
   the one picture and there is nothing to choose between. */
let paintMapSource = () => {};


/* ---- terrain overlay ------------------------------------------------------
   The overworld capture is a photograph looking straight down: it says what the ground looks
   like and nothing about its shape, so a cliff and a meadow are the same green.
   tools/pck/depthmap.py reads the game's own Terrain3D heights out of the pack and shades
   them, projected onto exactly this image.

   Hillshade at soft light is what ships, chosen by comparing all nine derived layers against
   every sensible blend mode. It wins because it is the only one that adds the shape of the
   land without making a claim: no threshold, no colour, nothing hidden underneath - the map
   still reads as the map, with the ground now legible. The layers that DO make claims - past
   45 degrees you cannot walk, this edge is a drop - are sharper but they paint over the
   picture, and that is a trade for a tool rather than for a map.

   The comparison rig that chose it is staging only, below.                                */
const TERRAIN_MAP = "";                      /* only the overworld has Terrain3D data */
let terrain = {layer: "relief", blend: "soft-light", alpha: 85};
let terrainImg = null;

let addTerrainLayer = function (m) {
  terrainImg = null;
  const on = m.id === TERRAIN_MAP;
  const head = document.getElementById("terrainHead");
  const ctl = document.getElementById("terrainCtl");
  if (head) head.hidden = !on;
  if (ctl) ctl.hidden = !on;
  if (!on) return;
  const img = el("img", "mapimg terrainlay");
  img.alt = "";
  img.draggable = false;
  stage.appendChild(img);
  terrainImg = img;
  applyTerrain();
};

function applyTerrain() {
  if (!terrainImg) return;
  const note = document.getElementById("terrainNote");
  if (!terrain.layer) {
    terrainImg.hidden = true;
    if (note) note.textContent = "";
    return;
  }
  terrainImg.hidden = false;
  terrainImg.src = "maps/terrain-" + terrain.layer + ".png";
  terrainImg.style.mixBlendMode = terrain.blend;
  terrainImg.style.opacity = (terrain.alpha / 100).toFixed(2);
  if (note) note.textContent = TERRAIN_NOTES[terrain.layer] || "";
}

/* Shown under the control in staging; production has no control, so nothing reads these
   there - they are declared outside the staging block only because applyTerrain is. */
const TERRAIN_NOTES = {
  relief:   "Hillshade from the game's own Terrain3D heights, sun in the north-west. It "
          + "carries no threshold and claims nothing about what is passable.",
  barrier:  "Ground that rises sharply within 3 units in warm, ground that falls away in "
          + "cool. The two are different problems: one you walk round, the other you fall off.",
  blocked:  "Slope past 45°, which is where the player stops being able to walk. Not a "
          + "guess: the player is a CharacterBody3D and player.scn sets no floor_max_angle, "
          + "so it runs at Godot's default.",
  edges:    "Only the boundary of the too-steep areas, so the map underneath stays readable.",
  wall:     "How far the ground rises within 3 units — something to go round.",
  drop:     "How far the ground falls away within 3 units — a cliff edge.",
  slope:    "The gradient in degrees, from 15° up. Below that almost the whole world "
          + "qualifies and colouring it buries the part that matters.",
  depth:    "Raw height. The least useful on its own — a plateau and a valley floor are both "
          + "walkable — but it is what the others are derived from.",
  contour:  "A line every 10 world units of height.",
};



/* ---- building the stage -------------------------------------------------- */

let points = [];          // every spawn on the current map, already projected
let shownPoints = [];     // the subset currently passing the filters

function build() {
  const m = S.map;
  [...mapsel.children].forEach(c => c.classList.toggle("on", c.dataset.map === m.id));

  // Give the frame the map's own proportions, so fitting it leaves no dead letterbox
  // bands. Clamped, so an unusually tall or wide capture cannot produce an absurd box.
  view.style.aspectRatio = clamp(m.w / m.h, 1.15, 2.4).toFixed(3);

  stage.replaceChildren();
  stage.style.width = m.w + "px";
  stage.style.height = m.h + "px";
  stage.classList.toggle("schematic", !m.img);

  if (m.img) {
    const img = el("img", "mapimg");
    img.src = "maps/" + m.img;
    img.alt = m.name;
    img.draggable = false;
    stage.appendChild(img);
    stage.style.backgroundSize = "";
  } else {
    // Same ruling as the monster sheets, at a round number of world units.
    const perUnit = Math.hypot(m.pz[0], m.pz[1]) || 1;
    const step = gridSpacing(m.w / perUnit / 8) * perUnit;
    stage.style.backgroundSize = `${step}px ${step}px`;
  }

  // The live feed carries the whole spawn list for the map the character is in, which is
  // how a marker can appear the moment you walk past something new: build_site cannot run
  // while the game is open, so the built data is frozen for the length of a session.
  const spawnSource = (liveSpawns && S.map === m) ? liveSpawns : (D.spawns[m.id] || []);

  points = spawnSource.map(([code, id, x, z]) => {
    const [px, py] = worldToPixel(m, x, z);
    // Everything of the same kind and id shares a key, which is what lets hovering one
    // marker light up the rest of that creature's spawns.
    return {...describe(code, id), px, py, x, z, key: code + ":" + id};
  });

  for (const p of (D.portals || {})[m.id] || []) {
    const [px, py] = worldToPixel(m, p.x, p.z);
    points.push({kind: "portal", name: p.name, lvl: 0, note: p.to ? "leads to " + p.to : "portal",
                 px, py, x: p.x, z: p.z, key: "portal:" + p.id,
                 open: p.mapId ? () => showMap(p.mapId) : null});
  }

  // Respawn points come from the map scene, so unlike the spawn points around them these
  // are all of them, not the ones that happened to be walked past.
  for (const p of (D.respawns || {})[m.id] || []) {
    const [px, py] = worldToPixel(m, p.x, p.z);
    points.push({kind: "respawn", name: "Respawn point", lvl: 0,
                 note: "where you return after dying",
                 px, py, x: p.x, z: p.z, key: "respawn:" + p.x + "," + p.z});
  }

  addTerrainLayer(m);
  const sh = document.getElementById("srcHead");
  if (sh) sh.hidden = !(m && m.alt);
  paintMapSource();
  drawCoverage(m);
  buildLegend();
  draw();
}

/** Image pixel back to world XZ, by solving the projection's 2x2 system. Used by the
    coordinate readout under the cursor and by the coverage grid. */
function pixelToWorld(m, ix, iy) {
  const det = m.px[0] * m.pz[1] - m.px[1] * m.pz[0];
  if (!det) return [0, 0];
  const dx = ix - m.o[0], dy = iy - m.o[1];
  return [(dx * m.pz[1] - dy * m.pz[0]) / det, (m.px[0] * dy - m.px[1] * dx) / det];
}

/* A level decides three things at once: what each creature is worth, which of them are worth
   drawing at all, and what the list beneath the map says. So the legend is rebuilt and the
   markers redrawn — syncPanel alone only re-counts what is already there, which left the map
   showing the old level's spawns under the new level's list. */
let levelRepaint = 0;
document.addEventListener("levelchange", () => {
  if (!S.map) return;
  hideTip();
  // Dragging the slider fires on every level it passes through, and each redraw rebuilds a
  // thousand markers. Coalesced to one per frame, so the drag stays smooth and the map is
  // never more than a frame behind the thumb.
  cancelAnimationFrame(levelRepaint);
  levelRepaint = requestAnimationFrame(() => { buildLegend(); draw(); });
});

function passes(p) {
  if (!S.on[p.kind]) return false;
  if (p.kind === "npc" && S.merchants && !p.shop) return false;
  if (S.q && !p.name.toLowerCase().includes(S.q)) return false;
  // The level filter only means something for monsters, so it never hides an NPC or a node.
  if (p.kind === "mob") {
    if (S.lo !== null && p.lvl < S.lo) return false;
    if (S.hi !== null && p.lvl > S.hi) return false;
    // Once you have said what level you are, anything that would give you nothing is not
    // worth drawing: it is the map answering "where can I still earn something".
    if (worthless(p)) return false;
  }
  return true;
}

/** Gives the reader no XP at their stated level. Never true while no level is stated. */
const worthless = p =>
  LEVEL.value !== null && p.kind === "mob" && !!p.monster && xpAt(p.monster) === 0;

function draw() {
  markers.replaceChildren();
  shownPoints = points.filter(passes);

  kinLayer.replaceChildren();         // its nodes belong to the run being replaced
  markers.classList.remove("dimmed");
  hovered = null;                     // whatever was under the pointer went with them
  placedScale = null;                 // fresh nodes carry no scale yet
  for (const p of shownPoints) {
    const mk = el("i", "mk mk-" + p.kind);
    mk.style.transform = at(p.px, p.py);
    if (p.colour) mk.style.setProperty("--c", p.colour);
    if (p.disc) mk.style.setProperty("--d", p.disc);
    // The level, written on the marker rather than implied by its shade.
    if (p.kind === "mob" && p.lvl) {
      mk.dataset.lvl = p.lvl;
      mk.style.setProperty("--b", p.badge);
    }
    // Three of a rift's roster are the reason you are in it, and at the same 25px as the
    // fourteen Ashscale Prowlers around them they were impossible to pick out.
    if (p.boss) mk.classList.add("boss");
    // The creature itself, cropped into the circle. Without a portrait the marker falls
    // back to the plain tinted disc, which is what the colour was doing on its own before.
    if (p.art && p.art.has) {
      mk.classList.add("mkart");
      mk.style.setProperty("--art", `url("icons/${p.art.kind}/${p.art.id}.png")`);
    }
    mk.dataset.key = p.key;
    mk.tabIndex = 0;
    mk.setAttribute("role", "button");
    if (p.open) mk.onclick = p.open;
    if (p.open) mk.onkeydown = e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); p.open(); }
    };
    // Which marker the pointer is on is settled by the view, further down, rather than by
    // enter and leave on the marker. Keyboard focus still speaks for itself.
    mk.pt = p;
    mk.onfocus = () => pointAt(mk);
    mk.onblur = () => { if (!shuffling && hovered === mk) pointAt(null); };
    p.node = mk;
    markers.appendChild(mk);
  }
  placeMarkers();

  syncPanel();

  const total = points.length;
  empty.hidden = total > 0;
  if (!total)
    empty.textContent = "Nothing marked on this map.";
}

/* Lights up every other spawn of whatever is being pointed at, which is the quickest way
   to see a creature's whole range without filtering down to it.

   It only means anything for something there are several of. A rift entrance and a respawn
   point are each one place in the world, so pointing at one used to dim the entire map to
   highlight the single marker under the cursor — and ring it in gold, which on a shape that
   is not a circle came out as a rectangle around the gravestone. */
const HIGHLIGHTS = new Set(["mob", "npc", "quest", "mine"]);

/**
 * Light every spawn of one creature and step the rest back.
 *
 * The lit ones are MOVED into their own layer rather than marked in place. Fading the rest
 * used to be a class on the parent and an opacity rule on every marker under it, which made
 * the browser recompute all 1,555 of them on entering a marker and again on leaving - 86ms
 * each way, so crossing the map with the mouse was a slideshow. Now the parent's own opacity
 * carries the fade, one composited property, and the handful being lit are lifted out of it.
 */
let shuffling = false;

function highlight(key) {
  // Moving a node takes it out of the document for an instant, and a node that leaves the
  // document loses focus. Putting it back keeps tabbing on the marker it was on, and the
  // flag stops the blur the move itself fires from reading as the pointer having left.
  const focused = document.activeElement;
  shuffling = true;
  try {
    while (kinLayer.firstChild) {
      const node = kinLayer.firstChild;
      node.classList.remove("kin");
      markers.appendChild(node);
    }
    if (key !== null) {
      for (const p of shownPoints) {
        if (!p.node || p.key !== key) continue;
        p.node.classList.add("kin");
        kinLayer.appendChild(p.node);
      }
    }
    markers.classList.toggle("dimmed", key !== null);
    if (focused && focused !== document.body && focused.isConnected
        && document.activeElement !== focused)
      focused.focus({preventScroll: true});
  } finally {
    shuffling = false;
  }
}

/* Which marker the pointer is over.
 *
 * Asked of the view, not of the markers. highlight() MOVES the marker being pointed at into
 * the lit layer, and a node that is reparented while the pointer is over it drops out of the
 * browser's hover bookkeeping: the matching leave never arrives, so the tooltip and the fade
 * stayed behind after the pointer had gone somewhere else. The view is never reparented, so
 * asking it what lies under the pointer answers correctly however the markers are shuffled.
 */
let hovered = null;

function pointAt(node) {
  if (node === hovered) return;
  hovered = node;
  if (!node) { hideTip(); highlight(null); return; }
  showTip(node, node.pt);
  highlight(HIGHLIGHTS.has(node.pt.kind) ? node.pt.key : null);
}

/** Screen position for every visible marker, from the stage's current transform. */
/* The scale the markers were last placed at, or null when they need placing again. */
let placedScale = null;

/** One marker's own transform: where it sits, then the half-size shift that centres it. */
const at = (px, py) =>
  `translate3d(${px * V.scale}px, ${py * V.scale}px, 0) translate(-50%, -50%)`;

/**
 * Put every marker where the current view says it goes.
 *
 * Panning moves the LAYER, not the markers. Each marker sits at its stage position times the
 * zoom, and the two marker layers carry the pan as a transform - so dragging the map changes
 * one composited property instead of two inline styles on every marker.
 *
 * That is the whole cost of this page. The overworld carries 1,555 markers and repositioning
 * them individually measured 0.75ms of JavaScript and 91ms of layout behind it - eleven
 * frames a second, and worst when the whole map is on screen because that is when none of
 * them are off it. A transform on the parent is not laid out at all.
 *
 * left/top are still rewritten when the ZOOM changes, because the scale is baked into them.
 * That is one pass per zoom step rather than one per frame of a drag.
 */
function placeMarkers() {
  if (placedScale !== V.scale) {
    // A marker's own position is a transform too, not left/top. Writing left moves a laid-out
    // box and the browser re-lays-out to find where it went; a transform is composited and
    // costs nothing to place. Zooming rewrote 1,555 of them and that alone was 123ms.
    // The -50% pair that used to live in the stylesheet is folded in here, because an
    // element has one transform and this one owns it.
    if (liveMarker)
      liveMarker.style.transform = at((+liveMarker.dataset.px), (+liveMarker.dataset.py));
    for (const p of shownPoints)
      if (p.node) p.node.style.transform = at(p.px, p.py);
    placedScale = V.scale;
  }
  const shift = `translate3d(${V.x}px, ${V.y}px, 0)`;
  markers.style.transform = shift;
  kinLayer.style.transform = shift;
  liveLayer.style.transform = shift;
}

/* ---- tooltip ------------------------------------------------------------- */

const tip = el("div", "tip");
tip.hidden = true;
document.body.appendChild(tip);

function showTip(anchor, p) {
  tip.replaceChildren();

  // A card rather than a line of text: the portrait is the fastest way to know what you are
  // pointing at, and the numbers answer "should I bother" without opening anything.
  /* The family tint runs along the top of the card, so the card and the dot it belongs to
     are visibly one object rather than two things that happen to share a colour. */
  tip.style.setProperty("--c", p.boss ? "var(--gold)" : (p.colour || "var(--faint)"));
  tip.appendChild(el("span", "tipaccent"));

  const body = el("div", "tipbody");
  const head = el("div", "tipcard");
  if (p.art && p.art.has) {
    /* The marker's own element at portrait size - not a picture of the marker but the
       same rules: the same disc, the same ring, the same level badge in the same corner.
       That is what ties the card to the dot you pointed at. */
    const art = el("i", "mk mk-" + p.kind + " mkart tipmk");
    art.style.setProperty("--art", `url("icons/${p.art.kind}/${p.art.id}.png")`);
    if (p.colour) art.style.setProperty("--c", p.colour);
    if (p.disc) art.style.setProperty("--d", p.disc);
    if (p.kind === "mob" && p.lvl) {
      art.dataset.lvl = p.lvl;
      if (p.badge) art.style.setProperty("--b", p.badge);
    }
    if (p.boss) art.classList.add("boss");
    head.appendChild(art);
  } else if (p.art) {
    const art = icon(p.art.kind, p.art.id, p.art.has, 68);
    art.classList.add("tipart");
    head.appendChild(art);
  }
  const text = el("div", "tiptext");
  const name = el("b", null, p.name);
  // Gold for a boss, and it has to be a class rather than an inline colour: the family tint
  // below is set inline, and inline wins, so painting both would leave the boss its family
  // colour exactly as the marker's highlight ring used to.
  if (p.boss) name.className = "bossname";
  else if (p.colour) name.style.color = p.colour;
  text.appendChild(name);

  const bits = [];
  // On a creature the level is written on the portrait, as it is on the marker; anywhere
  // else there is no badge to read it from.
  if (p.lvl && !(p.kind === "mob" && p.art && p.art.has)) bits.push("Level " + p.lvl);
  if (p.note) bits.push(p.note);
  if (bits.length) text.appendChild(el("i", null, bits.join(" · ")));

  const facts = el("div", "tipfacts");
  if (p.monster) {
    const reward = xpAt(p.monster);
    const kills = killsPerLevel(p.monster);
    facts.append(tipStat("Health", fmtNum(p.monster.hp)),
                 tipStat("Attack", fmtNum(p.monster.dmg)),
                 tipStat(LEVEL.value === null ? "XP" : "XP at " + LEVEL.value,
                         reward ? fmtNum(reward) : "none"));
    /* Four columns is the cap: they share 330px between them, and a fifth reading turns a
       card you glance at into a table you have to parse. The design says as much - more
       than four and this wants to be a sheet, which is what clicking the marker opens. */
    if (kills) facts.appendChild(tipStat("Kills/level", fmtNum(kills)));
    else if (p.drops) facts.appendChild(tipStat("Drops", String(p.drops)));
  } else if (p.kind === "npc") {
    // What they are FOR, which for most of them is work rather than trade.
    if (p.quests) facts.appendChild(tipStat("Gives", countLabel(p.quests, "quest")));
    if (p.shop) facts.appendChild(tipStat("Sells", countLabel(p.shop.items.length, "item")));
  }
  head.appendChild(text);
  body.appendChild(head);
  /* The figures sit under a hairline in equal columns rather than beside the name as
     chips: three or four numbers read as a row of readings, and a card that has to be
     scanned at cursor speed should put them where the eye already is. */
  if (facts.children.length) body.appendChild(facts);

  const kin = points.filter(o => o.key === p.key).length;
  const hint = kin > 1 ? `${kin} locations on this map` : "";
  if (hint) body.appendChild(el("p", "tiphint", hint));
  tip.appendChild(body);
  tip.hidden = false;

  const z = pageZoom();
  const r = anchor.getBoundingClientRect();
  const t = tip.getBoundingClientRect();
  // Both rects are painted pixels; left/top below are CSS lengths, which the root zoom
  // scales again. Divide once at the end rather than sprinkling it through the arithmetic.
  const left = Math.min(window.innerWidth - t.width - 12,
                        Math.max(8, r.left + r.width / 2 - t.width / 2));
  const top = r.top - t.height - 10 < 8 ? r.bottom + 10 : r.top - t.height - 10;
  tip.style.left = (left / z) + "px";
  tip.style.top = (top / z) + "px";
}
const hideTip = () => { tip.hidden = true; };

const tipStat = (label, value) => {
  const cell = el("span", "tipstat");
  cell.append(el("b", null, value), el("span", null, label));
  return cell;
};

/* ---- pan and zoom -------------------------------------------------------- */

const V = {scale: 1, x: 0, y: 0};
const MAX_SCALE = 6;

/* Two coordinate spaces, and they only agree below 1500px.

   getBoundingClientRect and pointer events speak PAINTED pixels. The stage's transform, the
   map's own pixels and every CSS length are LAYOUT pixels. The wide-screen rule puts `zoom`
   on the root, and from that point the two differ by exactly that factor — which is why the
   map came out cropped on the right and bottom by 15% on a 1440p screen and was fine on a
   1080p one. Everything below works in layout pixels. */
/* The map frame's own box, cached.
 *
 * Reading clientWidth or getBoundingClientRect forces the browser to settle pending style
 * before it can answer, and this page has 1,555 markers whose styles are pending after every
 * zoom - so a single innocent-looking read cost 87ms. The wheel handler made three of them
 * per event, which is why a trackpad flick took seconds while dragging stayed smooth.
 *
 * The frame only changes size when the window does or when the layout is re-fitted, and
 * both of those say so. */
let viewBox = null;
const invalidateViewBox = () => { viewBox = null; };
function viewRect() {
  if (!viewBox) {
    const r = view.getBoundingClientRect();
    viewBox = {left: r.left, top: r.top, width: view.clientWidth, height: view.clientHeight};
  }
  return viewBox;
}

const viewSize = () => viewRect();
const pointerAt = e => {
  const r = viewRect(), z = pageZoom();
  return [(e.clientX - r.left) / z, (e.clientY - r.top) / z];
};

const fitScale = () => {
  const r = viewSize();
  return Math.min(r.width / S.map.w, r.height / S.map.h);
};

/* Looked up once. apply() runs on every frame of a drag, and two querySelectors a frame is
   work for nothing when the bar is the same bar it was. */
const scaleBar = document.getElementById("scalebar");
const scaleBarRule = scaleBar.querySelector("span");
const scaleBarText = scaleBar.querySelector("b");
let barScale = null;

function apply() {
  stage.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.scale})`;
  placeMarkers();
  // The bar only says anything new when the zoom changes; panning leaves it alone.
  if (barScale !== V.scale) {
    const perUnit = Math.hypot(S.map.pz[0], S.map.pz[1]) || 1;
    // A round number of world units, drawn at whatever width that currently occupies.
    const units = gridSpacing(120 / (V.scale * perUnit));
    scaleBarRule.style.width = (units * perUnit * V.scale) + "px";
    scaleBarText.textContent = units + " units";
    barScale = V.scale;
  }
}

/** Keeps the map inside the frame, and centres it when it is smaller than the frame. */
function clampPan() {
  const r = viewSize();
  const w = S.map.w * V.scale, h = S.map.h * V.scale;
  V.x = w <= r.width ? (r.width - w) / 2 : clamp(V.x, r.width - w, 0);
  V.y = h <= r.height ? (r.height - h) / 2 : clamp(V.y, r.height - h, 0);
}

/* The panel is capped to the map's height so the two read as one block. The map's height
   comes from its own aspect and the column width, so it can only be known after layout —
   hence setting it here rather than in CSS. Cleared when the layout stacks on a narrow
   screen, where matching heights would mean a needlessly short list. */
function matchPanelHeight() {
  const panel = document.getElementById("panel");
  const stacked = getComputedStyle(document.querySelector(".maplayout"))
    .gridTemplateColumns.split(" ").length < 2;
  // clientHeight, not the painted rect: this becomes a CSS length, which is layout px.
  panel.style.maxHeight = stacked ? "" : view.clientHeight + "px";
  // After, not before: this writes a height, so the cached frame is only stale once the
  // write has happened. Invalidating first just refilled the cache with the old box.
  invalidateViewBox();
}

function fit() {
  // Centre explicitly rather than leaning on clampPan: a pan left over from the previous
  // map (or from before the reset) would otherwise survive and push the fitted view off
  // to one edge.
  const r = viewSize();
  V.scale = fitScale();
  V.x = (r.width - S.map.w * V.scale) / 2;
  V.y = (r.height - S.map.h * V.scale) / 2;
  clampPan();
  apply();
  matchPanelHeight();
}

/* apply() is synchronous everywhere else, because everywhere else calls it once. The wheel
   is the exception: it fires in bursts, so its repaint is batched into the next frame. */
let zoomQueued = false;
function requestZoomApply() {
  if (zoomQueued) return;
  zoomQueued = true;
  requestAnimationFrame(() => { zoomQueued = false; apply(); });
}

view.addEventListener("wheel", e => {
  e.preventDefault();
  const [cx, cy] = pointerAt(e);
  const next = clamp(V.scale * Math.exp(-e.deltaY * 0.0015), fitScale(), MAX_SCALE);
  const f = next / V.scale;
  // Zoom about the cursor: the world point under it must not move.
  V.x = cx - (cx - V.x) * f;
  V.y = cy - (cy - V.y) * f;
  V.scale = next;
  clampPan();
  apply();
}, {passive: false});

/* World position under the cursor, the same readout the game's own map shows. Y is terrain
   height and cannot be known from a top-down image, so only the two axes the rest of this
   project uses are reported. */
const coordsBox = document.getElementById("coords");

view.addEventListener("pointermove", e => {
  const [px, py] = pointerAt(e);
  const ix = (px - V.x) / V.scale;
  const iy = (py - V.y) / V.scale;
  if (ix < 0 || iy < 0 || ix > S.map.w || iy > S.map.h) { coordsBox.hidden = true; return; }
  const [wx, wz] = pixelToWorld(S.map, ix, iy);
  // Built once and rewritten, not rebuilt. This fires on every pointermove, and four fresh
  // elements a move is four elements of garbage a move.
  if (!coordsBox.firstChild)
    coordsBox.append(el("span", null, "X"), el("b"), el("span", null, "Z"), el("b"));
  coordsBox.children[1].textContent = Math.round(wx).toString();
  coordsBox.children[3].textContent = Math.round(wz).toString();
  coordsBox.hidden = false;
});
view.addEventListener("pointerleave", () => { coordsBox.hidden = true; });

let dragging = null;
view.addEventListener("pointerdown", e => {
  // Everything that sits on the map and handles its own click — markers, the key, the view
  // buttons — must be left alone here. Starting a drag calls setPointerCapture, which
  // retargets the rest of the pointer sequence to the map, so the button never sees its
  // pointerup and no click event is ever produced. It looks exactly like a dead button.
  if (e.target.closest(".mk, .mapctl, .mapscale")) return;
  // Layout pixels, like the transform it drives: read straight off the event, a drag on a
  // zoomed page moved the map further than the pointer went.
  const z = pageZoom();
  dragging = {x: e.clientX / z - V.x, y: e.clientY / z - V.y, id: e.pointerId};
  view.setPointerCapture(e.pointerId);
  view.classList.add("grabbing");
});
view.addEventListener("pointermove", e => {
  if (!dragging || dragging.id !== e.pointerId) return;
  const z = pageZoom();
  V.x = e.clientX / z - dragging.x;
  V.y = e.clientY / z - dragging.y;
  clampPan();
  apply();
});
for (const ev of ["pointerup", "pointercancel"])
  view.addEventListener(ev, e => {
    if (!dragging || dragging.id !== e.pointerId) return;
    dragging = null;
    view.classList.remove("grabbing");
    view.releasePointerCapture(e.pointerId);
  });

// Hit-testing from the event beats enter and leave on the markers on both counts: it is one
// listener rather than two per marker, and it keeps answering while highlight() moves the
// marker being pointed at. Panning is not pointing, so a drag drops the tooltip.
view.addEventListener("pointermove", e => {
  if (dragging) { pointAt(null); return; }
  pointAt(e.target.closest ? e.target.closest(".mk") : null);
});
view.addEventListener("pointerleave", () => pointAt(null));

// A resized window changes what "fit" means, so the clamp has to be redone.
addEventListener("resize", () => {
  invalidateViewBox();
  V.scale = Math.max(V.scale, fitScale());
  clampPan();
  apply();
  matchPanelHeight();
});

/* ---- go ------------------------------------------------------------------ */

if (!D.maps.length) {
  document.getElementById("filters").hidden = true;
  view.hidden = true;
  document.getElementById("note").textContent = "No maps available.";
} else {
  S.map = D.maps[0];
  build();
  fit();
}
</script>
</body>
</html>
