/* Resolve the theme before first paint: a stored choice if there is one, otherwise
   whatever the operating system asks for. Kept inline and tiny on purpose — loading it
   from app.js would paint the wrong theme first and then correct it. */
(function () {
  var saved = null;
  try { saved = localStorage.getItem("elegon-theme"); } catch (e) { /* private mode */ }
  var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
})();
</script>

<script src="data.js?v=c9e33aa8"></script>
<script src="app.js?v=c9e33aa8"></script>
<script>
const S = {q:"", lo:null, hi:null, aggressive:false, area:"", tier:0,
           sort:{key:"lvl", desc:false}};

document.getElementById("mylvl").appendChild(levelPicker());
document.addEventListener("levelchange", draw);

const flags = document.getElementById("flags");
const agg = el("span", "chip", "Aggressive only");
agg.onclick = () => { S.aggressive = !S.aggressive; agg.classList.toggle("on", S.aggressive); draw(); };

/* Where a creature lives, from its home map. Built from what the monsters themselves carry
   rather than from a list of areas, so a rift added by a patch appears the first time one of
   its creatures is walked past. "Anywhere" leads; the overworld is named rather than left as
   the empty string it really is. */
{
  const sel = document.getElementById("area");
  const names = D.mapNames || {};
  const seen = [...new Set(D.monsters.map(m => m.map == null ? "" : m.map))]
    .sort((a, b) => (names[a] || "Overworld").localeCompare(names[b] || "Overworld"));
  sel.appendChild(el("option", null, "Anywhere")).value = "";
  for (const id of seen) {
    const name = names[id] || (id ? id : "Overworld");
    // Rifts get their initials, the overworld does not - it is not one and should not
    // wear the mark.
    const o = el("option", null, id ? `${riftInitials(name)} · ${name}` : name);
    o.value = id === "" ? "__overworld" : id;
    sel.appendChild(o);
  }
  const mark = () => sel.classList.toggle("riftsel",
                                          !!sel.value && sel.value !== "__overworld");
  sel.onchange = () => { S.area = sel.value; mark(); draw(); };
  mark();
}
flags.appendChild(agg);

document.getElementById("q").oninput = e => { S.q = e.target.value.toLowerCase(); draw(); };
document.getElementById("lo").oninput = e => { S.lo = e.target.value === "" ? null : +e.target.value; draw(); };
document.getElementById("hi").oninput = e => { S.hi = e.target.value === "" ? null : +e.target.value; draw(); };
document.getElementById("inst").appendChild(instabilityInput(0, v => { S.tier = v; draw(); }));

/* The loot table's own source records, keyed by enemy id, so a monster row can reach its
   drops. Gathering nodes live in the same list and have no enemy id; they are not monsters
   and are reachable only from an item's source list. */
const SOURCE_BY_ENEMY = new Map(DROP.sources.filter(s => !s.node).map(s => [s.id, s]));

const COLS = [
  {key:"name", label:"Monster", left:true},
  {key:"where", label:"Where", left:true},
  {key:"lvl", label:"Level"},
  {key:"hp", label:"Health"},
  {key:"dmg", label:"Attack"},
  {key:"dps", label:"DPS"},
  {key:"xp", label:"XP"},
  {key:"kills", label:"Kills/level"},
  // Dropped from the header below when the build carries no drop table.
  {key:"drops", label:"Drops"},
  {key:"aggro", label:"Aggro range"},
  {key:"leash", label:"Gives up at"},
  {key:"respawn", label:"Respawn (s)"},
];

const fmt = fmtNum;

/* Where a creature lives, from the walk log. Unknown rather than blank when nothing has
   seen it: two of the seventy-four have never been recorded anywhere, and an empty cell
   would read as "the overworld" - which is itself a real answer for a dozen others. */
const MAP_NAMES_M = D.mapNames || {};
const placeOf = m => m.map === undefined || m.map === null
  ? "—" : (MAP_NAMES_M[m.map] || m.map || "Overworld");

function draw() {
  const hpMul = enemyHealthMult(S.tier), dmgMul = enemyDamageMult(S.tier);
  const rows = D.monsters.filter(m =>
      (!S.q || m.name.toLowerCase().includes(S.q)) &&
      (S.lo === null || m.lvl >= S.lo) &&
      (S.hi === null || m.lvl <= S.hi) &&
      (!S.aggressive || m.aggressive) &&
      (!S.area || (S.area === "__overworld" ? !m.map : m.map === S.area)))
    .map(m => {
      const src = SOURCE_BY_ENEMY.get(m.id) || null;
      // Sorting has to see the same number the column prints, so the scaling happens here
      // rather than at draw time.
      return {...m, src, drops: src ? dropsOf(src).length : 0,
              hp: Math.round(m.hp * hpMul), dmg: Math.round(m.dmg * dmgMul),
              dps: Math.round(m.dmg * dmgMul / (D.attackInterval || 3)),
              // The sort reads the row, not the cell, so the place has to be on it as text.
              where: placeOf(m),
              xp: xpAt(m), kills: killsPerLevel(m)};
    });

  applySort(rows, S.sort);
  const cols = COLS.filter(c => c.key !== "drops" || DROP.ready)
    .map(c => c.key !== "xp" ? c
      : {...c, label: LEVEL.value === null ? "XP" : "XP at " + LEVEL.value});
  sortableTable(document.getElementById("head"), cols, S.sort, draw);

  const body = document.getElementById("rows");
  body.replaceChildren();
  if (!rows.length) emptyRow(body, COLS.length, "No monsters match these filters.");
  for (const m of rows) {
    const tr = el("tr");
    /* The boss mark reads the creature's own flag rather than its loot source: a rift's
       bosses exist in the enemy table the moment it ships, and their drop tables only
       arrive once someone has been inside. Keyed on the source, Ashenroot's three were
       unmarked for exactly as long as nobody had walked it. */
    const td = nameCell("monsters", m.id, m.icon, m.name, m.boss ? "mname boss" : "mname");
    if (m.aggressive) td.firstChild.appendChild(el("span", "tag", "aggressive"));
    tr.appendChild(td);
    tr.appendChild(el("td", "dim", placeOf(m)));
    tr.appendChild(el("td", null, m.lvl));
    tr.appendChild(el("td", null, fmt(m.hp)));
    tr.appendChild(el("td", null, fmt(m.dmg)));
    // What the attack is worth over time. Every creature measured swings on the same 3s
    // cycle, so this is the attack divided by it - the number that decides whether you can
    // stand in front of one, which a per-hit figure never says on its own.
    const dpsCell = el("td", null, fmt(m.dps));
    dpsCell.title = `${fmt(m.dmg)} every ${D.attackInterval || 3}s`;
    tr.appendChild(dpsCell);
    tr.appendChild(el("td", m.xp ? null : "z", m.xp ? fmt(m.xp) : "·"));
    tr.appendChild(el("td", m.kills ? null : "z", m.kills ? fmt(m.kills) : "·"));
    // The header drops this column too - the body is built cell by cell, so skipping one
    // without the other shifts every value one column to the left.
    if (DROP.ready) tr.appendChild(m.drops ? el("td", null, m.drops) : el("td", "z", "·"));
    tr.appendChild(el("td", null, m.aggro + "m"));
    tr.appendChild(el("td", null, m.leash ? m.leash + "m" : "·"));
    tr.appendChild(el("td", null, m.respawn));
    /* The sheet used to be reachable only through a loot source, so a build without drop
       tables made every row unclickable and took the spawn map down with it. The map is not
       drop data and should not have gone: where a creature stands is worth a sheet on its
       own, so one is synthesised from the creature when no source exists. */
    const sheetSrc = m.src || {i: "m" + m.id, id: m.id, name: m.name, lvl: m.lvl,
                               icon: m.icon, node: false, boss: !!m.boss};
    // Clickable only when the sheet would have something on it. With no loot table, a
    // creature nobody has ever recorded a sighting of opens a panel containing a Back
    // button, which is worse than a row that simply does not respond.
    const worthOpening = (DROP.ready && m.src) || spawnsFor(SPAWN_ENEMY, m.id).length > 0;
    if (worthOpening)
      clickableRow(tr, DROP.ready ? "Loot table for " + m.name : "Where " + m.name + " stands",
                   () => openSheet(monsterSheet(sheetSrc)));
    body.appendChild(tr);
  }
}
draw();

</script>
